<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Reading Mythroads' Lean code</title>
        <style>
            :root {
                color-scheme: light;
                --ink: #17221e;
                --muted: #60716a;
                --paper: #fffdf5;
                --wash: #eef3e8;
                --line: #d7ddcf;
                --accent: #116d59;
                --code: #15241f;
            }
            * { box-sizing: border-box; }
            html { scroll-behavior: smooth; }
            body {
                margin: 0;
                color: var(--ink);
                background: linear-gradient(135deg, #dce9df, #f1ead7 52%, #d7e8e7);
                font: 17px/1.72 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            }
            .shell {
                display: grid;
                grid-template-columns: 275px minmax(0, 850px);
                gap: 48px;
                width: min(1240px, calc(100% - 48px));
                margin: 0 auto;
                padding: 48px 0 96px;
            }
            aside {
                position: sticky;
                top: 24px;
                align-self: start;
                max-height: calc(100vh - 48px);
                overflow: auto;
                padding: 24px;
                border: 1px solid color-mix(in srgb, var(--line), transparent 20%);
                border-radius: 22px;
                background: color-mix(in srgb, var(--paper), transparent 7%);
                box-shadow: 0 18px 45px rgb(32 57 45 / 10%);
            }
            .eyebrow {
                margin: 0 0 8px;
                color: var(--accent);
                font-size: 12px;
                font-weight: 800;
                letter-spacing: .16em;
                text-transform: uppercase;
            }
            aside strong { display: block; font: 700 24px/1.15 ui-serif, Georgia, serif; }
            a { color: var(--accent); text-underline-offset: 3px; }
            nav { margin-top: 24px; }
            nav a {
                display: block;
                padding: 5px 8px;
                border-radius: 8px;
                color: var(--muted);
                font-size: 13px;
                line-height: 1.35;
                text-decoration: none;
            }
            nav a:hover { color: var(--accent); background: var(--wash); }
            nav a.depth-3 { padding-left: 22px; font-size: 12px; }
            main {
                min-width: 0;
                padding: clamp(32px, 6vw, 76px);
                border: 1px solid var(--line);
                border-radius: 28px;
                background: var(--paper);
                box-shadow: 0 24px 70px rgb(32 57 45 / 14%);
            }
            h1, h2, h3 { color: #102119; font-family: ui-serif, Georgia, serif; line-height: 1.15; }
            h1 { margin: 0 0 28px; font-size: clamp(42px, 7vw, 68px); letter-spacing: -.035em; }
            h2 { margin: 64px 0 18px; padding-top: 10px; font-size: 34px; letter-spacing: -.02em; }
            h3 { margin: 38px 0 12px; font-size: 24px; }
            p, li { max-width: 74ch; }
            blockquote {
                margin: 28px 0;
                padding: 18px 24px;
                border-left: 5px solid var(--accent);
                border-radius: 0 14px 14px 0;
                background: var(--wash);
                font: 600 20px/1.5 ui-serif, Georgia, serif;
            }
            blockquote p { margin: 0; }
            pre {
                overflow: auto;
                padding: 22px 24px;
                border-radius: 16px;
                color: #e8f4ea;
                background: var(--code);
                box-shadow: inset 0 0 0 1px rgb(255 255 255 / 8%);
                font: 14px/1.58 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            }
            code {
                padding: .12em .35em;
                border-radius: 6px;
                color: #0e5b4a;
                background: #e8efe5;
                font: .88em ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            }
            pre code { padding: 0; color: inherit; background: transparent; font-size: inherit; }
            table { display: block; width: 100%; overflow-x: auto; border-collapse: collapse; }
            th, td { padding: 11px 14px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
            th { color: var(--accent); background: var(--wash); font-size: 13px; letter-spacing: .03em; }
            hr { margin: 48px 0; border: 0; border-top: 1px solid var(--line); }
            @media (max-width: 900px) {
                .shell { display: block; width: min(100% - 24px, 850px); padding-top: 12px; }
                aside { position: static; margin-bottom: 12px; max-height: none; }
                nav { display: none; }
                main { padding: 28px 22px 54px; border-radius: 20px; }
            }
        </style>
    </head>
    <body>
        <div class="shell">
            <aside>
                <p class="eyebrow">Mythroads engineering</p>
                <strong>Lean → Convex</strong>
                <nav id="toc" aria-label="On this page"></nav>
            </aside>
            <main id="article"><p>Rendering walkthrough…</p></main>
        </div>
        <script type="module">
            import { marked } from 'marked'

            const markdown = await fetch('./lean-code-walkthrough.md').then((response) => {
                if (!response.ok) throw new Error(`Could not load walkthrough (${response.status})`)
                return response.text()
            })
            const article = document.querySelector('#article')
            article.innerHTML = marked.parse(markdown)

            const usedIds = new Set()
            const slug = (text) => {
                const base = text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') || 'section'
                let id = base
                let counter = 2
                while (usedIds.has(id)) id = `${base}-${counter++}`
                usedIds.add(id)
                return id
            }
            const toc = document.querySelector('#toc')
            for (const heading of article.querySelectorAll('h2, h3')) {
                heading.id = slug(heading.textContent)
                const link = document.createElement('a')
                link.href = `#${heading.id}`
                link.className = `depth-${heading.tagName.slice(1)}`
                link.textContent = heading.textContent
                toc.append(link)
            }
        </script>
    </body>
</html>
