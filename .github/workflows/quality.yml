name: Quality

on:
    push:
    pull_request:

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - uses: leanprover/lean-action@v1
              with:
                  lake-package-directory: proofs
                  build: true
                  test: false
                  lint: false
                  axiom-audit: true
            - run: npm ci
            - run: npm run check
